# Single source of truth for every DTM source feeding the elevation pyramid.
#
# Adding a source = one entry here + `bin/sources.py check` + a Layer A build
# for that id alone. Nothing else is rebuilt.
#
# Derived from /etc/freemap.conf ELEVATION_SOURCES on fm6 (2026-08-20), with
# every value re-measured with gdalinfo rather than copied. `bin/sources.py
# check` re-verifies against the files and fails on drift.
#
# priority: higher wins in the mosaic. NOTE the two opposite conventions:
#   - freemap-v3-api ELEVATION_SOURCES is FIRST wins  -> emit in priority DESC
#   - gdalbuildvrt is LAST wins                       -> emit in priority ASC
#   `bin/sources.py elevation-sources` handles the reversal; do not hand-edit.
#
# native_res: metres, from the source geotransform (informational; drives
#   finest_level). Web-Mercator ground resolution at 49N is 102700 / 2^z, so
#   z14 = 6.27 m and every national source downsamples into it.
#
# finest_level: the finest pyramid level this source is materialised at. A
#   source is never upsampled into a level finer than its own resolution --
#   that is what keeps z14/z13 sparse and avoids a 25x upsample of GEDTM30.
#
# nodata: `declared` means the dataset declares a usable value and gdalwarp
#   will pick it up on its own. A number here is passed as -srcnodata.
#
# footprint: `tiles` = union of the VRT's source rectangles (exact, cheap).
#            `bbox`  = the declared lon/lat box (conservative; fine for
#                      single-file sources that declare correct nodata).

grid:
  # EPSG:3857, standard XYZ resolutions. Projected pixel size at level z is
  # 156543.03392804097 / 2^z -- PROJECTED metres, not ground metres.
  crs: EPSG:3857
  tile_px: 32768 # 2^15 -> 313.086 km at z14; overview chain reaches z8 in-file
  block_px: 512
  finest_level: 14
  coarsest_level: 8

defaults:
  resampling: average # downsampling: never max, never nearest
  finest_level: 14
  nodata: declared
  footprint: tiles

sources:
  - id: sk
    api_name: sk
    path: /fm/storage1/dtm/dmr5_jtsk03.tif
    priority: 230
    native_res: 1.0
    crs: EPSG:8353 # S-JTSK [JTSK03] / Krovak East North
    nodata: declared # 3.4e38 float-max sentinel
    footprint: bbox
    bbox: [16.8, 47.7, 22.6, 49.7]

  - id: cz
    api_name: cz
    path: /fm/storage1/dtm/cz_dem.tif
    priority: 225
    native_res: 1.0
    crs: EPSG:5514
    nodata: declared # -9999
    footprint: bbox
    bbox: [11.905673, 48.198833, 18.999296, 51.387301]

  - id: pl
    api_name: pl
    path: /fm/storage1/dtm/pl/poland_dtm.vrt
    priority: 220
    native_res: 1.0
    crs: EPSG:2180
    nodata: declared # 0.0 -- see fill_nodata_md
    fill_nodata_md: 5
    bbox: [13.169196, 49.268522, 23.378659, 55.638533]
    note: >-
      GUGiK uses 0 for out-of-coverage, which collides with genuine 0.00 m
      coastal terrain (Zulawy): those pixels would be read as nodata and fall
      through to a lower-priority source. gdal_fillnodata -md 5 interpolates
      the resulting speckle from its neighbours while leaving large
      out-of-coverage regions as nodata, so they still fall through properly.

  - id: se
