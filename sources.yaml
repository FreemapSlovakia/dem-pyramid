    nodata: declared # -9999, set 2026-08-20 -- see note
    bbox: [13.346758, 45.407588, 16.613883, 46.894504]
    note: >-
      Originally declared NO nodata, on the VRT or on the underlying tiles, so
      it returned 0 over every uncovered part of its bbox -- which reaches into
      Italy, Austria and Croatia, and outranks both (195 > at 180 > it 165).
      That flattened real terrain in two neighbouring countries to sea level,
      and reached the elevation API's premium path, which has no way to tell a
      spurious 0 from a real one. Fixed upstream with
      `gdal_edit.py -a_nodata -9999 /fm/storage1/dtm/sl/sl.vrt`; the original
      is backed up at /fm/storage2/dem/backup/sl.vrt.orig. `dem-tool check` now
      guards it: if the VRT is ever regenerated without nodata, it fails.

