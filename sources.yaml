    path: /fm/storage1/dtm/se/se.vrt
    priority: 215
    native_res: 1.0
    crs: EPSG:5845 # SWEREF99 TM + RH2000 height (compound)
    nodata: declared # -9999
    bbox: [9.08, 55.1381, 25.5503, 69.1826]

