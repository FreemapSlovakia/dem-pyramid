# nginx vhost for the terrain service.
#
# Named terrain rather than panorama: viewshed and shadows are the same
# analysis over the same pyramid and will be routes on this service, not
# separate hosts.
#
# Install:
#   cp terrain.freemap.sk.conf /etc/nginx/sites-available/terrain.freemap.sk
#   cp terrain-limits.conf     /etc/nginx/conf.d/
#   ln -s ../sites-available/terrain.freemap.sk /etc/nginx/sites-enabled/
#   certbot --nginx -d terrain.freemap.sk        # needs the DNS record first
#   nginx -t && systemctl reload nginx

server {
	server_name terrain.freemap.sk;

	if ($blocked_country) {
		return 444;
	}

	add_header Alt-Svc 'h3=":443"; ma=86400' always;

	# A render occupies nine cores for seconds and they are serialised, so a
	# request may sit in the queue behind another. Defaults would drop the
	# connection long before the answer is ready.
	proxy_read_timeout 300s;
	proxy_send_timeout 300s;
	proxy_connect_timeout 10s;

	# Responses are multipart with a PNG and a depth buffer; buffering the
	# whole thing to disk before sending adds latency for no gain.
	proxy_buffering off;

	location = /health {
		access_log off;
		add_header Access-Control-Allow-Origin $terrain_cors always;
		proxy_pass http://127.0.0.1:3100;
	}

	location / {
		# A JSON POST is never a simple request, so the browser preflights
		# it. Answer that here rather than spending a render slot on it.
		if ($request_method = OPTIONS) {
			add_header Access-Control-Allow-Origin $terrain_cors always;
			add_header Access-Control-Allow-Methods "POST, GET, OPTIONS" always;
			# Echo whatever the browser asked for rather than listing
			# headers. A fixed list silently blocks the request as soon as
			# the client adds an Authorization or any custom header -- the
			# preflight still answers 204, and the browser rejects it
			# afterwards, which looks like the server working fine. The
			# origin allowlist above is what actually restricts access.
			add_header Access-Control-Allow-Headers $http_access_control_request_headers always;
			add_header Access-Control-Allow-Credentials "true" always;
			add_header Access-Control-Max-Age 86400 always;
			add_header Content-Length 0;
			return 204;
		}

		add_header Access-Control-Allow-Origin $terrain_cors always;
		add_header Access-Control-Allow-Credentials "true" always;
		# Without this the client cannot read the queue depth: CORS hides
		# every response header except a handful of safelisted ones.
		add_header Access-Control-Expose-Headers "x-queue-depth" always;

		# One render is seconds of nine cores. Without a limit a single
		# client can occupy the box indefinitely, so cap the rate and the
		# number of connections held open at once. Tune once real traffic
		# exists -- see terrain-limits.conf for the zones.
		limit_req zone=terrain burst=10 nodelay;
		limit_conn terrain_conn 4;

		# Force queue priority to zero for anything arriving publicly.
		# proxy_set_header overwrites whatever the client sent, so a caller
		# cannot promote itself past authenticated users. Anything wanting a
		# higher priority must reach the service on loopback instead, having
		# authenticated the user first.
		proxy_set_header X-Priority "0";

		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;

		# Requests are small JSON; nothing here should be large.
		client_max_body_size 256k;

		proxy_pass http://127.0.0.1:3100;
	}

	http2 on;

	listen 443 ssl;
	listen [::]:443 ssl;
	# certbot fills these in
	# ssl_certificate     /etc/letsencrypt/live/terrain.freemap.sk/fullchain.pem;
	# ssl_certificate_key /etc/letsencrypt/live/terrain.freemap.sk/privkey.pem;
	# include /etc/letsencrypt/options-ssl-nginx.conf;
	# ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
	if ($host = terrain.freemap.sk) {
		return 301 https://$host$request_uri;
	}

	listen 80;
	listen [::]:80;
	server_name terrain.freemap.sk;
	return 404;
}
