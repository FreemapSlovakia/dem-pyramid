# nginx vhost for the terrain service.
#
# Named terrain rather than panorama: viewshed and shadows are the same
# analysis over the same pyramid and will be routes on this service, not
# separate hosts.
#
# Install and update: bin/deploy-nginx.sh, which copies this file, the limits
# and the CORS snippet into place, tests, and reloads. `--check` diffs the
# three against the host without touching anything.
#
# First time on a new host, before that script will pass `nginx -t`:
#   certbot certonly --nginx -d terrain.freemap.sk   # needs the DNS record
#   ln -s ../sites-available/terrain.freemap.sk /etc/nginx/sites-enabled/

server {
	server_name terrain.freemap.sk;

	if ($blocked_country) {
		return 444;
	}

	add_header Alt-Svc 'h3=":443"; ma=86400' always;

	# A render occupies nine cores for seconds and they are serialised, so a
	# request may sit in the queue behind another. Defaults would drop the
	# connection long before the answer is ready.
	proxy_read_timeout 300s;
	proxy_send_timeout 300s;
	proxy_connect_timeout 10s;

	# Responses are multipart with a PNG and a depth buffer; buffering the
	# whole thing to disk before sending adds latency for no gain.
	proxy_buffering off;

	# The peak list is JSON and compresses hard: 904 KB to 299 KB on a
	# 2631-peak view, and to 153 KB once the server stopped writing
	# seventeen significant figures per number. Worth having on a phone.
	#
	# `gzip on` is already set globally, and does nothing here without both
	# of these: the stock `gzip_types` is text/html alone, and the stock
	# `gzip_proxied off` skips proxied responses entirely -- which is every
	# response this vhost serves.
	#
	# The image half of the multipart is AVIF and does not compress: 397 563
	# bytes in, 397 516 out. That is ~8 ms of pointless work per render
	# against ten to twenty-five seconds of ray marching, and there is no way
	# to compress one part of a multipart body and not the other, so it is
	# accepted rather than worked around.
	# `*`, not `multipart/form-data`, and the explicit type does not work.
	# nginx matches `gzip_types` against the Content-Type it copied from the
	# upstream, and it only trims the parameter off first when that parameter
	# is `charset=`. Ours is `multipart/form-data; boundary=dempyramid...`,
	# so the string being matched keeps the boundary and never equals the
	# type. Tried, and the symptom is quiet: no `Content-Encoding`, no `Vary`,
	# no error -- nginx simply decides the response is not a listed type.
	#
	# Everything this vhost returns is either the multipart or a short error,
	# so matching everything costs nothing beyond the AVIF that would not
	# compress anyway.
	gzip_types *;
	gzip_proxied any;
	gzip_comp_level 5;
	# Below about a kilobyte the header costs more than the saving.
	gzip_min_length 1024;
	# Caches key on it, and the response differs by Accept-Encoding.
	gzip_vary on;

	location = /health {
		access_log off;
		include snippets/terrain-cors.conf;
		proxy_pass http://127.0.0.1:3100;
	}

	# Progress streams. A prefix match, so it wins over `location /` below.
	#
	# Kept out of the render zones deliberately: a stream is not a render, it
	# is a timer and a few bytes every 250 ms. Left in `location /` every
	# render would cost two requests against a 20-per-minute rate, so a user
	# reframing a view would burn the burst twice as fast, and the streams --
	# which stay open for the whole render -- would fill a four-connection cap
	# at two renders in flight.
	location /progress/ {
		# EventSource sends a plain GET, so the preflight half of this is
		# dead weight here; the response still needs the origin header or the
		# browser drops the stream.
		include snippets/terrain-cors.conf;
		# An event stream that gets buffered is not an event stream. Inherited
		# from the server block, repeated here because it is load-bearing.
		proxy_buffering off;
		proxy_cache off;
		# Same reason, and the one that would actually bite: the gzip filter
		# holds bytes until it has a block worth compressing, so progress
		# events would arrive in batches after the render they describe had
		# already finished. A few hundred bytes per render is not worth
		# compressing anyway.
		gzip off;
		proxy_http_version 1.1;
		proxy_set_header Connection "";

		limit_req zone=terrain_sse burst=60 nodelay;
		limit_conn terrain_sse_conn 16;

		proxy_set_header X-Priority "0";
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_pass http://127.0.0.1:3100;
	}

	# Viewsheds are one AVIF and a line of JSON, and the AVIF is the whole
	# payload -- 9 MB for a 30 km overlay at full resolution. Compressing it
	# gains nothing (AVIF is already compressed) and costs hundreds of
	# milliseconds at comp_level 5, where the `gzip_types *` above was
	# reasoned about a 400 KB panorama whose peak list genuinely compresses.
	location = /viewshed {
		include snippets/terrain-cors.conf;
		gzip off;

		limit_req zone=terrain burst=10 nodelay;
		limit_conn terrain_conn 4;

		proxy_set_header X-Priority "0";
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		client_max_body_size 256k;
		proxy_pass http://127.0.0.1:3100;
	}

	location / {
		include snippets/terrain-cors.conf;

		# One render is seconds of nine cores. Without a limit a single
		# client can occupy the box indefinitely, so cap the rate and the
		# number of connections held open at once. Tune once real traffic
		# exists -- see terrain-limits.conf for the zones.
		limit_req zone=terrain burst=10 nodelay;
		limit_conn terrain_conn 4;

		# Force queue priority to zero for anything arriving publicly.
		# proxy_set_header overwrites whatever the client sent, so a caller
		# cannot promote itself past authenticated users. Anything wanting a
		# higher priority must reach the service on loopback instead, having
		# authenticated the user first.
		proxy_set_header X-Priority "0";

		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;

		# Requests are small JSON; nothing here should be large.
		client_max_body_size 256k;

		proxy_pass http://127.0.0.1:3100;
	}

	http2 on;

	listen 443 ssl;
	listen [::]:443 ssl;
	# Real paths, not the commented placeholders certbot fills in. Those made
	# this file undeployable: copying it over the live one deleted the two
	# lines certbot had put there, `listen 443 ssl` was then left with no
	# certificate, and `nginx -t` refused the config. The standing workaround
	# was to run `certbot --nginx -d terrain.freemap.sk` after every install
	# and pick "reinstall this existing certificate" so certbot wrote the
	# lines back. Naming them here retires that step.
	#
	# Safe to commit because renewal does not touch the vhost -- it replaces
	# the files these point at. Certbot rewrites the config only when it is
	# asked to install a certificate, which is what that workaround was doing.
	#
	# On a host that has no certificate yet, obtain it before installing this
	# vhost -- nginx will not start pointing at files that do not exist:
	#   certbot certonly --nginx -d terrain.freemap.sk
	ssl_certificate /etc/letsencrypt/live/terrain.freemap.sk/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/terrain.freemap.sk/privkey.pem;
	# 34 of the 35 vhosts on this box include these and terrain was the one
	# that did not. nginx.conf already sets the same protocols and cipher
	# preference globally, so what these actually add is session caching and
	# tickets-off.
	include /etc/letsencrypt/options-ssl-nginx.conf;
	ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
	if ($host = terrain.freemap.sk) {
		return 301 https://$host$request_uri;
	}

	listen 80;
	listen [::]:80;
	server_name terrain.freemap.sk;
	return 404;
}
