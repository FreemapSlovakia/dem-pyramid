# CORS for the terrain vhost, as a snippet included by every location.
#
# Install:
#   cp terrain-cors.conf /etc/nginx/snippets/
#
# Not `conf.d/`: that is included into `http`, and these are location-context
# directives. It has to be somewhere included by path instead.
#
# A snippet rather than the obvious alternative of setting these once in the
# server block, because `add_header` does not merge across levels -- a
# location declaring any `add_header` of its own drops every one inherited
# from above. Three of the four locations here set their own, so server-level
# headers would silently apply to exactly the one that did not.
#
# That is not hypothetical: `= /viewshed` is an exact-match location, so it
# won the OPTIONS request too, and the preflight block that used to live only
# in `location /` never ran for it. The browser saw a 405 with no
# `Allow-Methods` and refused the POST that followed. Everything worked in
# curl, which does not preflight. Include this everywhere and a new endpoint
# cannot repeat it.
#
# `$terrain_cors` is the origin allowlist, mapped in conf.d/terrain-limits.conf.

# A JSON POST is never a simple request, so the browser preflights it. Answer
# that here rather than spending a render slot on it.
if ($request_method = OPTIONS) {
	add_header Access-Control-Allow-Origin $terrain_cors always;
	add_header Access-Control-Allow-Methods "POST, GET, OPTIONS" always;
	# Echo whatever the browser asked for rather than listing headers. A
	# fixed list silently blocks the request as soon as the client adds an
	# Authorization or any custom header -- the preflight still answers 204,
	# and the browser rejects it afterwards, which looks like the server
	# working fine. The origin allowlist is what actually restricts access.
	add_header Access-Control-Allow-Headers $http_access_control_request_headers always;
	add_header Access-Control-Allow-Credentials "true" always;
	add_header Access-Control-Max-Age 86400 always;
	add_header Content-Length 0;
	return 204;
}

add_header Access-Control-Allow-Origin $terrain_cors always;
add_header Access-Control-Allow-Credentials "true" always;
# Without this the client cannot read the queue depth: CORS hides every
# response header except a handful of safelisted ones.
add_header Access-Control-Expose-Headers "x-queue-depth" always;
# Repeated here because `add_header` does not merge: including this snippet
# is what makes a location declare headers of its own, which would otherwise
# drop the server-level Alt-Svc.
add_header Alt-Svc 'h3=":443"; ma=86400' always;
