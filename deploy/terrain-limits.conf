# Rate-limit zones for the terrain service. Must live in http context, so this
# goes in /etc/nginx/conf.d/ rather than in the vhost.
#
# The unit of cost here is unusually large: one panorama is seconds of nine
# cores, and renders are serialised, so a handful of concurrent callers is
# already the machine's capacity. These are deliberately tight -- loosen them
# once real traffic shows what is needed.

limit_req_zone $binary_remote_addr zone=terrain:10m rate=6r/m;
limit_conn_zone $binary_remote_addr zone=terrain_conn:10m;
