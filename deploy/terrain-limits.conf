# Rate-limit zones for the terrain service. Must live in http context, so this
# goes in /etc/nginx/conf.d/ rather than in the vhost.
#
# The unit of cost here is unusually large: one panorama is seconds of nine
# cores, and renders are serialised, so a handful of concurrent callers is
# already the machine's capacity. These are deliberately tight -- loosen them
# once real traffic shows what is needed.

# Origins allowed to call the service from a browser. Echoing the request's
# own origin rather than sending "*", because the two are not equivalent: "*"
# is refused for credentialed requests, and an explicit origin keeps the door
# open if cookies are ever needed. Anything not listed maps to the empty
# string, which emits no header at all and so is refused by the browser.
map $http_origin $terrain_cors {
	default                         "";
	"https://www.freemap.sk"        $http_origin;
	"https://www.freemap.eu"        $http_origin;
	"https://local.freemap.sk:9000" $http_origin;
	"http://local.freemap.sk:9000"  $http_origin;
}

# The burst matters more than the rate here. Clients are told to abort and
# resubmit when the user reframes a view, so a short flurry of requests is
# normal and expected -- most of them cancelled a second later, costing almost
# nothing. It is the sustained rate that has to stay low.
limit_req_zone $binary_remote_addr zone=terrain:10m rate=20r/m;
limit_conn_zone $binary_remote_addr zone=terrain_conn:10m;

# Progress streams are rationed separately, because they are not renders.
# One costs a timer and a few bytes every 250 ms, and one exists for the whole
# life of the render it reports on. Counted against the zones above they would
# halve the effective request rate -- every render is a POST and a stream --
# and, being long-lived, would hit a four-connection cap at two renders in
# flight rather than four.
limit_req_zone $binary_remote_addr zone=terrain_sse:10m rate=120r/m;
limit_conn_zone $binary_remote_addr zone=terrain_sse_conn:10m;
